# docker-compose.yml のyt-downloaderサービスに追加
services:
  yt-downloader:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./cookies.txt:/app/cookies.txt
    env_file:
      - .env
    environment:
      - BGUTIL_POT_PROVIDER_URL=http://pot-provider:4416
    depends_on:
      - pot-provider
    restart: unless-stopped

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    