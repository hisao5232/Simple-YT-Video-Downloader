<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Downloader</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <main class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-500">
        YouTube Downloader
      </h1>
      <p class="text-slate-400 text-sm mt-2">
        URLを入力して「ダウンロード」ボタンを押してください
      </p>
    </div>

    <!-- URL Input Form -->
    <form id="downloadForm" class="space-y-4">
      <div>
        <label for="videoUrl" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          YouTube URL
        </label>
        <input
          type="url"
          id="videoUrl"
          placeholder="https://www.youtube.com/watch?v=... または https://youtu.be/..."
          required
          class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
        >
      </div>

      <button
        type="submit"
        id="submitBtn"
        class="w-full py-3.5 px-6 bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-bold rounded-xl shadow-lg transition flex justify-center items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span id="btnText">動画をダウンロード</span>
        <!-- Spinner Icon -->
        <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </form>

    <!-- Status Messages & Progress -->
    <div id="statusContainer" class="mt-6 hidden">
      <!-- Loading Message -->
      <div id="loadingStatus" class="flex items-center space-x-3 bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div class="relative flex-1">
          <div class="flex justify-between text-xs text-slate-400 mb-1">
            <span>動画データ変換・ダウンロード中...</span>
            <span id="statusSubtext">処理中</span>
          </div>
          <!-- Pulse bar animation -->
          <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
            <div class="bg-gradient-to-r from-red-500 to-amber-500 h-full animate-pulse rounded-full w-full"></div>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="hidden bg-red-900/40 border border-red-500/50 text-red-200 p-4 rounded-xl text-sm leading-relaxed">
      </div>
    </div>
  </main>

  <footer class="mt-8 text-center text-xs text-slate-500">
    Stateless YouTube Downloader
  </footer>

  <script>
    // ★バックエンドのURLを設定★
    // ローカルテスト時: http://localhost:8000
    // Cloud Runデプロイ後: https://xxx-xxx-uc.a.run.app
    const BACKEND_URL = "http://localhost:8000";

    const form = document.getElementById("downloadForm");
    const videoUrlInput = document.getElementById("videoUrl");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    const statusContainer = document.getElementById("statusContainer");
    const loadingStatus = document.getElementById("loadingStatus");
    const errorMessage = document.getElementById("errorMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const url = videoUrlInput.value.trim();
      if (!url) return;

      // UIを処理中状態に変更
      setLoading(true);
      hideError();

      try {
        const downloadEndpoint = `${BACKEND_URL}/download?url=${encodeURIComponent(url)}`;
        const response = await fetch(downloadEndpoint);

        if (!response.ok) {
          let errorDetail = "動画の取得に失敗しました。";
          try {
            const errJson = await response.json();
            if (errJson.detail) errorDetail = errJson.detail;
          } catch (_) {}
          throw new Error(errorDetail);
        }

        // Responseからファイル名を取得 (Content-Dispositionヘッダーの解析)
        const disposition = response.headers.get("Content-Disposition");
        let filename = "video.mp4";

        if (disposition) {
        // UTF-8エンコードされたファイル名の抽出 (filename*=UTF-8''...)
        const utf8FilenameMatch = disposition.match(/filename\*=UTF-8''([^;]+)/i);
        if (utf8FilenameMatch && utf8FilenameMatch[1]) {
            filename = decodeURIComponent(utf8FilenameMatch[1]);
        } else {
            // 通常のファイル名抽出 (filename="...")
            const standardMatch = disposition.match(/filename="?([^"]+)"?/i);
            if (standardMatch && standardMatch[1]) {
            filename = decodeURIComponent(standardMatch[1]);
            }
          }
        }

        // StreamデータをBlob化してブラウザで自動ダウンロードを実行
        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        // クリーンアップ
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

      } catch (err) {
        showError(err.message || "予期せぬエラーが発生しました。");
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      videoUrlInput.disabled = isLoading;
      
      if (isLoading) {
        btnText.textContent = "処理中...";
        btnSpinner.classList.remove("hidden");
        statusContainer.classList.remove("hidden");
        loadingStatus.classList.remove("hidden");
      } else {
        btnText.textContent = "動画をダウンロード";
        btnSpinner.classList.add("hidden");
        loadingStatus.classList.add("hidden");
      }
    }

    function showError(msg) {
      statusContainer.classList.remove("hidden");
      errorMessage.textContent = msg;
      errorMessage.classList.remove("hidden");
    }

    function hideError() {
      errorMessage.classList.add("hidden");
    }
  </script>
</body>
</html>
